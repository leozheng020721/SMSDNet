random_seed: 42
experiment_name: "seo_segformer_hsv_lab_pool_gates"
device: "cuda"
num_workers: 2
pin_memory: true
cudnn_benchmark: true

model:
  arch: "SegFormer"
  variant: "multicolor"
  encoder: "mit_b3"
  encoder_weights: "imagenet"
  ignore_index: 255
  multicolor:
    aux_channels: [8, 16, 32, 64]
    pooling: "avg"
    gate_channels: 16
    gate_bias: -2.0

loss:
  type: "combo"
  focal_alpha: 0.25
  focal_gamma: 3.0
  focal_weight: 2.0
  dice_weight: 1.0

training:
  batch_size: 4
  epochs: 50
  learning_rate: 6.0e-5
  weight_decay: 0.01
  optimizer: "AdamW"
  scheduler:
    type: "CosineAnnealingWarmRestarts"
    T_0: 10
    T_mult: 2
  mixed_precision: false

dataset:
  type: "seo"
  root_dir: "E:/Dataset/SEO"
  val_ratio: 0.2
  split_mode: "predefined"
  input_size: 512
  in_channels: 3
  num_classes: 2
  normalization:
    max_reflectance: 1.0
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    div_value: 0.3
