random_seed: 42
experiment_name: "aisd_segformer_rgb_baseline"
device: "cuda"
num_workers: 2
pin_memory: true
cudnn_benchmark: true

model:
  arch: "SegFormer"
  variant: "baseline"
  encoder: "mit_b3"
  encoder_weights: "imagenet"
  ignore_index: 255

loss:
  type: "combo"
  focal_alpha: 0.25
  focal_gamma: 3.0
  focal_weight: 2.0
  dice_weight: 1.0

training:
  batch_size: 2
  epochs: 50
  learning_rate: 6.0e-5
  weight_decay: 0.01
  optimizer: "AdamW"
  scheduler:
    type: "CosineAnnealingWarmRestarts"
    T_0: 10
    T_mult: 2
  mixed_precision: false

dataset:
  type: "aisd"
  root_dir: "E:/MyPythonProject/MAMNet/datasets/AISD"
  split_mode: "predefined"
  train_dir: "Train412"
  val_dir: "Val51"
  test_dir: "E:/MyPythonProject/MAMNet/datasets/Test51"
  input_size: 512
  in_channels: 3
  num_classes: 2
  normalization:
    max_reflectance: 1.0
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    div_value: 0.3
