random_seed: 42
experiment_name: "seo_segformer_native512_aux_cca_nir_mixup_minmax"

device: "cuda"
num_workers: 2
prefetch_factor: 1
pin_memory: true
cudnn_benchmark: true

model:
  arch: "SegFormer"
  variant: "multicolor"
  encoder: "mit_b3"
  encoder_weights: "imagenet"
  ignore_index: 255
  multicolor:
    aux_channels: [8, 16, 32, 64]
    pooling: "avg"
    gate_channels: 16
    gate_bias: -2.0
    auxiliary_supervision: true
    aux_decoder_channels: 16
    nir:
      enabled: true
    cross_scale_attention:
      enabled: true
      attention_channels: 64

loss:
  type: "combo"
  focal_alpha: 0.25
  focal_gamma: 3.0
  focal_weight: 2.0
  dice_weight: 1.0
  auxiliary_weight: 0.4

training:
  batch_size: 6
  epochs: 50
  learning_rate: 6.0e-5
  weight_decay: 0.01
  optimizer: "AdamW"
  scheduler:
    type: "CosineAnnealingLR"
    T_max: 50
    eta_min: 1.0e-6
  mixed_precision: true
  mixup:
    enabled: true
    alpha: 0.2
    probability: 0.5

dataset:
  type: "seo"
  root_dir: "../SEO"
  supervision:
    mode: "minmax_agreement"
    min_root: "shadows_min/shadows"
    max_root: "shadows_max/shadow_max_compressed"
    ignore_uncertainty: true
    missing_policy: "skip"
  val_ratio: 0.2
  spatial_mode: "crop"
  input_size: 512
  tile_stride: 384
  tile_batch_size: 4
  in_channels: 3
  num_classes: 2
  normalization:
    max_reflectance: 1.0
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    div_value: 0.3
  nir:
    enabled: true
    root_dir: "../SEO/nir_aligned_v1"
    manifest: "registration_with_candidates.csv"
    include_candidates: false
    normalization:
      percentiles: [1.0, 99.0]
    crop_retries: 4
    min_valid_fraction: 0.05
